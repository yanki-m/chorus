<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="780" fill="#FFFFFF"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="#555"/>
    </marker>
    <marker id="arrow-up-grey" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title strip -->
  <text x="450" y="32" font-size="13" letter-spacing="2" text-anchor="middle" fill="#888">CHORUS  ·  MANY SURFACES · ONE MEMORY · caura-memclaw</text>

  <!-- ─── Claude Desktop ─── -->
  <g>
    <rect x="165" y="60" width="220" height="120" rx="14" fill="#FCEDE5" stroke="#D97757" stroke-width="2"/>
    <text x="275" y="100" font-size="20" font-weight="700" text-anchor="middle" fill="#D97757">Claude Desktop</text>
    <text x="275" y="124" font-size="12" text-anchor="middle" fill="#7a4030">Anthropic · desktop app</text>
    <text x="275" y="156" font-size="11" text-anchor="middle" fill="#a0786a" font-style="italic">agent_id = "claude-desktop"</text>
  </g>

  <!-- Claude Desktop arrows -->
  <line x1="255" y1="183" x2="255" y2="317" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="295" y1="317" x2="295" y2="183" stroke="#555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up)"/>
  <text x="247" y="255" font-size="11" fill="#555" text-anchor="end">write</text>
  <text x="303" y="255" font-size="11" fill="#555">recall</text>

  <!-- ─── ChatGPT ─── -->
  <g>
    <rect x="515" y="60" width="220" height="120" rx="14" fill="#E6F6F1" stroke="#10A37F" stroke-width="2"/>
    <text x="625" y="100" font-size="20" font-weight="700" text-anchor="middle" fill="#10A37F">ChatGPT</text>
    <text x="625" y="124" font-size="12" text-anchor="middle" fill="#0a6b56">OpenAI · Custom GPT</text>
    <text x="625" y="156" font-size="11" text-anchor="middle" fill="#5a9a86" font-style="italic">agent_id = "chatgpt"</text>
  </g>

  <!-- ChatGPT arrows -->
  <line x1="605" y1="183" x2="605" y2="317" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="645" y1="317" x2="645" y2="183" stroke="#555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up)"/>
  <text x="597" y="255" font-size="11" fill="#555" text-anchor="end">write</text>
  <text x="653" y="255" font-size="11" fill="#555">recall</text>

  <!-- ─── caura-memclaw substrate ─── -->
  <g>
    <rect x="60" y="320" width="780" height="260" rx="16" fill="#F4F0FA" stroke="#7850c8" stroke-width="3"/>
    <text x="450" y="355" font-size="20" font-weight="700" text-anchor="middle" fill="#5a3aa3">caura-memclaw — shared tenant</text>
    <text x="450" y="375" font-size="11" text-anchor="middle" fill="#7850c8" font-style="italic">every surface writes here · scope='all' reads see all writers</text>

    <!-- Memory card: claude-desktop -->
    <g>
      <rect x="100" y="400" width="700" height="36" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <circle cx="122" cy="418" r="6" fill="#D97757"/>
      <text x="144" y="423" font-size="14" fill="#222">"User prefers dark mode in dashboards"</text>
      <text x="788" y="423" font-size="11" text-anchor="end" fill="#888">claude-desktop · 14:02</text>
    </g>

    <!-- Memory card: chatgpt -->
    <g>
      <rect x="100" y="442" width="700" height="36" rx="8" fill="#FFFFFF" stroke="#10A37F" stroke-width="1.5"/>
      <circle cx="122" cy="460" r="6" fill="#10A37F"/>
      <text x="144" y="465" font-size="14" fill="#222">"User loves Sweden, especially Denmark in the spring"</text>
      <text x="788" y="465" font-size="11" text-anchor="end" fill="#888">chatgpt · 14:08</text>
    </g>

    <!-- Memory card: claude-desktop -->
    <g>
      <rect x="100" y="484" width="700" height="36" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <circle cx="122" cy="502" r="6" fill="#D97757"/>
      <text x="144" y="507" font-size="14" fill="#222">"Decision: ship Chorus v1 by Friday"</text>
      <text x="788" y="507" font-size="11" text-anchor="end" fill="#888">claude-desktop · 14:15</text>
    </g>

    <!-- Memory card: chatgpt -->
    <g>
      <rect x="100" y="526" width="700" height="36" rx="8" fill="#FFFFFF" stroke="#10A37F" stroke-width="1.5"/>
      <circle cx="122" cy="544" r="6" fill="#10A37F"/>
      <text x="144" y="549" font-size="14" fill="#222">"Production region = eu-west-1"</text>
      <text x="788" y="549" font-size="11" text-anchor="end" fill="#888">chatgpt · 14:22</text>
    </g>
  </g>

  <!-- Arrow from Chorus up to memclaw -->
  <line x1="450" y1="620" x2="450" y2="583" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up-grey)"/>
  <text x="460" y="606" font-size="11" fill="#666" font-style="italic">scope='all' read</text>

  <!-- ─── Chorus dashboard box ─── -->
  <g>
    <rect x="300" y="620" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#888" stroke-width="2"/>
    <text x="450" y="652" font-size="18" font-weight="600" text-anchor="middle" fill="#444">🎼 Chorus dashboard</text>
    <text x="450" y="673" font-size="11" text-anchor="middle" fill="#888" font-style="italic">read-only window · per-surface attribution</text>
    <text x="450" y="690" font-size="10" text-anchor="middle" fill="#aaa">Streamlit · poll-on-refresh</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="738" font-size="22" font-weight="600" text-anchor="middle" fill="#222" font-style="italic">Agents don't talk. Memory remembers.</text>
  <text x="450" y="762" font-size="12" text-anchor="middle" fill="#888">No horizontal arrows. Surfaces coordinate only through what's in caura-memclaw.</text>
</svg>

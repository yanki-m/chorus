<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="900" height="640" fill="#FFFFFF"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" font-size="13" letter-spacing="2" text-anchor="middle" fill="#888">CHORUS  ·  MANY MUSES · ONE MEMORY · caura-memclaw</text>

  <!-- ─── Claude ─── -->
  <g>
    <rect x="60" y="60" width="220" height="100" rx="14" fill="#FCEDE5" stroke="#D97757" stroke-width="2"/>
    <text x="170" y="98" font-size="22" font-weight="700" text-anchor="middle" fill="#D97757">Clio</text>
    <text x="170" y="120" font-size="12" text-anchor="middle" fill="#7a4030">muse of memory · Claude</text>
    <text x="170" y="145" font-size="11" text-anchor="middle" fill="#a0786a" font-style="italic">agent_id = "clio"</text>
  </g>

  <!-- Claude arrows -->
  <line x1="150" y1="165" x2="150" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="190" y1="305" x2="190" y2="165" stroke="#555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up)"/>
  <text x="142" y="240" font-size="11" fill="#555" text-anchor="end">write</text>
  <text x="198" y="240" font-size="11" fill="#555">recall</text>

  <!-- ─── GPT ─── -->
  <g>
    <rect x="340" y="60" width="220" height="100" rx="14" fill="#E6F6F1" stroke="#10A37F" stroke-width="2"/>
    <text x="450" y="98" font-size="22" font-weight="700" text-anchor="middle" fill="#10A37F">Calliope</text>
    <text x="450" y="120" font-size="12" text-anchor="middle" fill="#0a6b56">muse of eloquence · GPT</text>
    <text x="450" y="145" font-size="11" text-anchor="middle" fill="#5a9a86" font-style="italic">agent_id = "calliope"</text>
  </g>

  <!-- GPT arrows -->
  <line x1="430" y1="165" x2="430" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="470" y1="305" x2="470" y2="165" stroke="#555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up)"/>
  <text x="422" y="240" font-size="11" fill="#555" text-anchor="end">write</text>
  <text x="478" y="240" font-size="11" fill="#555">recall</text>

  <!-- ─── Gemini ─── -->
  <g>
    <rect x="620" y="60" width="220" height="100" rx="14" fill="#E6EEFC" stroke="#4285F4" stroke-width="2"/>
    <text x="730" y="98" font-size="22" font-weight="700" text-anchor="middle" fill="#4285F4">Urania</text>
    <text x="730" y="120" font-size="12" text-anchor="middle" fill="#1c4694">muse of analysis · Gemini</text>
    <text x="730" y="145" font-size="11" text-anchor="middle" fill="#7099d6" font-style="italic">agent_id = "urania"</text>
  </g>

  <!-- Gemini arrows -->
  <line x1="710" y1="165" x2="710" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow-down)"/>
  <line x1="750" y1="305" x2="750" y2="165" stroke="#555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-up)"/>
  <text x="702" y="240" font-size="11" fill="#555" text-anchor="end">write</text>
  <text x="758" y="240" font-size="11" fill="#555">recall</text>

  <!-- ─── memclaw vault ─── -->
  <g>
    <rect x="60" y="315" width="780" height="245" rx="16" fill="#F4F0FA" stroke="#7850c8" stroke-width="3"/>
    <text x="450" y="350" font-size="20" font-weight="700" text-anchor="middle" fill="#5a3aa3">caura-memclaw — shared fleet</text>
    <text x="450" y="370" font-size="11" text-anchor="middle" fill="#7850c8" font-style="italic">fleet_id = "chorus"</text>

    <!-- Memory card: clio -->
    <g>
      <rect x="100" y="390" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
      <circle cx="122" cy="413" r="6" fill="#D97757"/>
      <text x="144" y="418" font-size="14" fill="#222">"User prefers dark mode in dashboards"</text>
      <text x="788" y="418" font-size="11" text-anchor="end" fill="#888">clio · turn 1</text>
    </g>

    <!-- Memory card: calliope -->
    <g>
      <rect x="100" y="445" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#10A37F" stroke-width="1.5"/>
      <circle cx="122" cy="468" r="6" fill="#10A37F"/>
      <text x="144" y="473" font-size="14" fill="#222">"Top name picks: MemSync, HiveMind"</text>
      <text x="788" y="473" font-size="11" text-anchor="end" fill="#888">calliope · turn 2</text>
    </g>

    <!-- Memory card: urania -->
    <g>
      <rect x="100" y="500" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
      <circle cx="122" cy="523" r="6" fill="#4285F4"/>
      <text x="144" y="528" font-size="14" fill="#222">"Production region = eu-west-1"</text>
      <text x="788" y="528" font-size="11" text-anchor="end" fill="#888">urania · turn 4</text>
    </g>
  </g>

  <!-- Tagline -->
  <text x="450" y="600" font-size="22" font-weight="600" text-anchor="middle" fill="#222" font-style="italic">Many muses. One memory.</text>
  <text x="450" y="625" font-size="12" text-anchor="middle" fill="#888">No horizontal arrows — agents coordinate only through what's in the vault.</text>
</svg>
